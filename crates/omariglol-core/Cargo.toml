[package]
name = "omariglol-core"
description = "LXI / SCPI protocol core: VXI-11, raw TCP, discovery, screenshot, benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Enable the USBTMC / SUMP USB backend. Off by default so the core still builds
# (and CI still passes) on machines without the libusb-1.0 system library.
usb = ["dep:rusb"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
socket2 = { workspace = true }
rusb = { workspace = true, optional = true }
