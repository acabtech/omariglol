[package]
name = "riglol-cli"
description = "Command-line interface for riglol, feature-parity with lxi-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "riglol"
path = "src/main.rs"

[features]
default = ["usb"]
# USB (USBTMC) support, forwarded to the core. Disable with
# `--no-default-features` on machines without libusb-1.0.
usb = ["omariglol-core/usb"]

[dependencies]
omariglol-core = { workspace = true }
omariglol-script = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
