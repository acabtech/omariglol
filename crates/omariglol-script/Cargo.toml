[package]
name = "omariglol-script"
description = "Embedded CPython scripting engine for omariglol measurement scripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Forward USB (USBTMC) support to the core so scripts can use transport="usb".
usb = ["omariglol-core/usb"]

[dependencies]
omariglol-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pyo3 = { workspace = true }
