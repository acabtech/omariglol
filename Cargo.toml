[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri desktop shell is a standalone package so the `tauri` CLI and
# `tauri-build` see a conventional layout, and so `cargo build` at the root
# stays fast for the protocol core + CLI.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Sam Ralial <sam@alatcerdas.tech>"]
repository = "https://github.com/acabtech/omariglol"
homepage = "https://github.com/acabtech/omariglol"

[workspace.dependencies]
omariglol-core = { path = "crates/omariglol-core", version = "0.1.2" }
omariglol-script = { path = "crates/omariglol-script", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
socket2 = "0.5"
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
pyo3 = { version = "0.23", features = ["auto-initialize", "abi3-py310"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
